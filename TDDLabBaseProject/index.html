<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeBound - Crea tu cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/styles.css">

  </head>
  <body>
    
    <!-- Navbar -->
    <header class="navbar">
      <div class="brand" id="brand-logo" style="cursor: pointer;">
        <img src="./src/assets/logo.jpg" alt="Logo HomeBound" />
        <span>HomeBound</span>
      </div>
      <div class="nav-actions">
        <!-- Botón exclusivo para Admin -->
        <button id="nav-btn-panel" class="btn-panel oculto">📊 Panel</button>
        <!-- Botón Publicar (protegido con sesión) -->
        <button id="nav-btn-publicar" class="btn-publicar">+ Publicar</button>
        <!-- Botón Ingresar (solo visible sin sesión) -->
        <button id="nav-btn-ingresar" class="btn-ingresar">Ingresar</button>
        <!-- Sección de Usuario (visible con sesión) -->
        <div id="nav-user-info" class="user-info oculto">
          <span id="nav-user-name" class="user-name">👤 Usuario</span>
          <button id="nav-btn-logout" class="btn-logout" title="Cerrar sesión">Cerrar sesión</button>
        </div>
      </div>
    </header>



        <!-- Card Central (Vistas SPA) -->
    <main class="container">
      <!-- VISTA 1: REGISTRO -->
      <section id="vista-registro" class="card">
        <img src="./src/assets/logo.jpg" alt="HomeBound" class="card-logo" />
        <h1 class="card-title">Crea tu cuenta</h1>
        <p class="card-subtitle">Así podrás reportar hallazgos y pérdidas.</p>

        <form id="registro-form">
          <div class="form-group">
            <label for="nombre-input">Nombre</label>
            <input type="text" id="nombre-input" />
          </div>
          <div class="form-group">
            <label for="correo-input">Correo electrónico</label>
            <input type="email" id="correo-input" />
          </div>
          <div class="form-group">
            <label for="password-input">Contraseña</label>
            <input type="password" id="password-input" />
          </div>
          <button type="submit" id="registrar-button" class="btn-registrar">Registrarme</button>
        </form>

        <div id="mensaje-div"></div>

        <p class="login-link">
          ¿Ya tienes cuenta? <a href="#login" id="link-ir-login">Inicia sesión</a>
        </p>
      </section>

      <!-- VISTA 2: INICIO DE SESIÓN (Oculto por defecto) -->
      <section id="vista-login" class="card oculto">
        <img src="./src/assets/logo.jpg" alt="HomeBound" class="card-logo" />
        <h1 class="card-title">Inicia sesión</h1>
        <p class="card-subtitle">Ingresa tus credenciales para acceder a HomeBound.</p>

        <form id="login-form">
          <div class="form-group">
            <label for="login-correo-input">Correo electrónico</label>
            <input type="email" id="login-correo-input" />
          </div>
          <div class="form-group">
            <label for="login-password-input">Contraseña</label>
            <input type="password" id="login-password-input" />
          </div>
          <button type="submit" id="login-button" class="btn-registrar">Iniciar sesión</button>
        </form>

        <div id="login-mensaje-div"></div>

        <p class="login-link">
          ¿No tienes cuenta? <a href="#registro" id="link-ir-registro">Regístrate</a>
        </p>
      </section>
    </main>


    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
